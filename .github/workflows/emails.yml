name: Emails

# Renders every email template in packages/emails the ways inboxes do (light,
# dark, forced dark, styles stripped; phone and desktop widths), checks WCAG
# AA contrast in light and dark, and uploads the screenshots with a contact
# sheet (screenshots/index.html) for a look by eye. The client-support and
# structure checks run in CI's `turbo test`; docs/email-testing.md has the
# whole process.

on:
  pull_request:
    paths:
      - "packages/emails/**"
      - ".github/workflows/emails.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Email renders
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @formulate/emails exec playwright install --with-deps chromium

      - name: Check and render
        run: |
          pnpm --filter @formulate/emails check
          pnpm --filter @formulate/emails test:render

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: email-renders
          path: packages/emails/screenshots/
          retention-days: 14
