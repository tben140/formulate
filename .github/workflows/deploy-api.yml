name: Deploy API

# Deploys apps/api, the Cloudflare Worker that records the app's email consent
# and restock alerts (ADR 0007, SHO-118), so it no longer depends on someone
# running `wrangler deploy` from a laptop.
#
# - By hand (Actions → Deploy API → Run workflow), from any branch: for
#   shipping a Worker change before it merges. Only people with write access
#   to the repository can run it.
# - ⚠️ Not on push, for now. Production runs Durable Object migrations v1
#   (RateLimiter), v2 (CampaignLog) and v3 (OrderBackup), and this branch's
#   wrangler.jsonc declares v1 only, because the order backup (#108) and the
#   campaign log (#211) haven't landed here yet. A deploy from this code would
#   be a production deploy nobody asked for, of a Worker that doesn't match
#   production: Cloudflare should refuse to drop the two classes without a
#   `deleted_classes` migration, but the standing rule is to deploy only from
#   code that carries all three. Restore the push trigger (branches: [main],
#   paths: apps/api/**, packages/analytics/**, this file) once it does.
#
# The Worker's own secrets (KLAVIYO_PRIVATE_KEY, KLAVIYO_BACK_IN_STOCK_KEY) are
# set in Cloudflare, never here; a deploy leaves them as they are. This job
# only needs a Cloudflare API token that can edit Workers.

on:
  workflow_dispatch:

# One deploy at a time per branch, and never cancel one halfway. Each branch
# has its own queue: a queue holds one pending run and drops any older one, so
# a shared queue would let a manual run from a branch push out a pending main
# deploy, and main's change would never ship (that matters again once the
# push trigger is back).
concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Whether both secrets are set: they're empty on forks and until added,
      # and the job then skips rather than failing. The token itself goes only
      # to the deploy step, so install scripts and tests never see it.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      - name: Skip without Cloudflare credentials
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::API deploy skipped - CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not both set."

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: env.HAS_CLOUDFLARE == 'true'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version: 22
          cache: pnpm

      - if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm install --frozen-lockfile

      # The Worker's tests pin its security rules (no CORS, no error bodies,
      # only the email read). A deploy that breaks one never ships.
      - name: Test the Worker
        if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm --filter @formulate/api test

      # Wrangler from the lockfile, not a floating version, and it reads the
      # token and account from the environment.
      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @formulate/api run deploy
