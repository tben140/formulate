name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: the job checks out, installs and builds, and writes nothing
# back to the repository. Without this the token gets the repository's default
# permissions (CodeQL actions/missing-workflow-permissions, SHO-147).
permissions:
  contents: read

jobs:
  verify:
    # ⚠️ Do NOT rename this job. Branch protection requires the status check
    # context "Lint, typecheck, build", matched by this exact string. Renaming
    # it means the required check never reports and every PR blocks forever
    # under the strict up-to-date rule. Change the protection rule first.
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    env:
      # Placeholders only. Both apps construct their Storefront client with a
      # `?? ""` fallback and every page is server-rendered on demand, so no
      # real credential is needed to lint, typecheck or bundle. Never put a
      # real token here — this repository is public.
      SHOPIFY_STORE_DOMAIN: example.myshopify.com
      SHOPIFY_STOREFRONT_TOKEN: ""
      SHOPIFY_API_VERSION: "2026-04"
      EXPO_PUBLIC_SHOPIFY_STORE_DOMAIN: example.myshopify.com
      EXPO_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ""
      EXPO_PUBLIC_SHOPIFY_API_VERSION: "2026-04"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on any critical advisory in the dependency tree (the October
      # 2026 security pass). Critical only: the high and moderate findings
      # left are inside Expo's CLI with no fix released, listed in
      # docs/security.md. Fix with an upgrade or a pnpm override.
      - name: No critical vulnerabilities
        run: pnpm audit --audit-level critical

      # Proves the committed codegen output is genuinely generated and has not
      # drifted from the query documents. `git diff --exit-code` fails the run
      # if regenerating changes anything.
      - name: Verify generated types are up to date
        run: |
          pnpm --filter @formulate/shopify codegen
          git diff --exit-code -- packages/shopify/src/generated

      # The same guarantee for the design tokens. theme.css and tokens.css are
      # generated from packages/tokens/src/tokens.ts and committed, and the
      # theme serves its own committed copies from assets/, because it has no
      # build step. A hand edit to any of them, or a tokens.ts change without
      # regenerating, would otherwise ship unnoticed (SHO-12 follow-up).
      - name: Verify generated design tokens are up to date
        run: |
          pnpm --filter @formulate/tokens build
          pnpm --filter @formulate/theme build
          git diff --exit-code -- packages/tokens apps/theme/assets

      - run: pnpm turbo lint typecheck test build
