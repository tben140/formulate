packages:
  - "apps/*"
  - "packages/*"

# Native resolver used by eslint-import-resolver-typescript (pulled in by
# eslint-config-expo). It ships a Rust binary and needs its postinstall step.
allowBuilds:
  # Sentry's CLI, used by @sentry/nextjs only to upload source maps. Its
  # binary arrives through a per-platform optional dependency, so the
  # postinstall fallback download isn't needed.
  '@sentry/cli': false
  # Bundler used by @shopify/cli; ships prebuilt platform binaries.
  esbuild: true
  # Image processing used by Next.js and Expo tooling; ships prebuilt binaries.
  sharp: true
  unrs-resolver: true
  # Cloudflare's Workers runtime, used by wrangler to run apps/api locally.
  # Ships a platform binary and needs its postinstall step to unpack it.
  workerd: true

# Supply-chain guard: a version must be 7 days old before pnpm will install it
# (10080 minutes). Hijacked releases are usually caught and pulled within
# hours to days, so this keeps them out without holding fixes back for long.
# The policy, and the 2-day fast track for security fixes, is in AGENTS.md
# under "Dependencies". pnpm's own default is only 1 day.
minimumReleaseAge: 10080

# Fast-tracked versions, one line each, each with a comment saying which
# advisory it fixes and when it may be removed (once it's 7 days old).
# Empty for now.
minimumReleaseAgeExclude: []

# @shopify/hydrogen-react declares a hard (non-optional) peer dependency on
# vite, because it is built for the Hydrogen/Vite stack. We only use its
# DOM components and its bundled Storefront schema, both of which work fine
# under Next.js — so we suppress the warning rather than installing Vite.
peerDependencyRules:
  ignoreMissing:
    - vite

# REQUIRED by NativeWind v5. It compiles CSS with lightningcss and then
# deserialises the result inside react-native-css; only 1.30.1 produces a
# payload react-native-css@3.0.7 can read. Anything newer (1.32.0 via
# @tailwindcss/node, or 1.33.0 via react-native-css's own peer range) fails at
# Metro bundle time with:
#
#   SyntaxError: global.css: failed to deserialize;
#   expected an object-like struct named Specifier, found ()
#
# The error surfaces only when bundling, never at install time. Do not bump
# this until NativeWind v5 leaves preview and states a newer supported version.
overrides:
  lightningcss: 1.30.1
  # Expo SDK 57 expects exactly React 19.2.3. Pinning workspace-wide keeps a
  # single React copy under the hoisted node linker — two copies would break
  # hooks in the Expo app.
  react: 19.2.3
  react-dom: 19.2.3
