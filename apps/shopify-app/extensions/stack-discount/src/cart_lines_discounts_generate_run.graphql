query CartInput {
  cart {
    lines {
      id
      # A nested line is a free gift (or another add-on): it neither counts
      # towards the stack nor gets 10% off.
      parentRelationship {
        parent {
          id
        }
      }
      sellingPlanAllocation {
        sellingPlan {
          id
          recurringDeliveries
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
