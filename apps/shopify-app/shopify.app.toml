# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# The Double Helix app in Shopify's Dev Dashboard: the home for Shopify
# Functions, checkout extensions and Events subscriptions (SHO-171).
# The client id is public. The client secret never belongs in this repository:
# it stays in the Dev Dashboard and, when needed, goes into Vercel as Sensitive.
# Access scopes start empty; each feature adds only the scopes it needs.

client_id = "25a2aa35a50545b4b2146c5162def482"
name = "Double Helix"
application_url = "https://example.com"
embedded = true

[webhooks]
api_version = "2026-10"

  # The campaigns' change log (apps/api/src/campaign-log.ts): every edit to a
  # campaign record, signed with this app's secret. The Worker URL is public.
  [[webhooks.subscriptions]]
  topics = [ "metaobjects/create", "metaobjects/update", "metaobjects/delete" ]
  uri = "https://formulate-api.tben140-6bc.workers.dev/webhooks/shopify/campaigns"
  filter = "type:campaign"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# The campaigns CLI (packages/campaigns) signs in as this app: campaigns and
# their collections, the campaign discount Function's discounts, and orders
# for the report. See docs/campaigns.md, "The campaigns CLI".
scopes = "read_customers,read_discounts,read_inventory,read_metaobject_definitions,read_metaobjects,read_orders,read_products,read_publications,write_customers,write_discounts,write_metaobjects,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]
