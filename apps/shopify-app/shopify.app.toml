# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# The Double Helix app in Shopify's Dev Dashboard: the home for Shopify
# Functions, checkout extensions and Events subscriptions (SHO-171).
# The client id is public. The client secret never belongs in this repository:
# it stays in the Dev Dashboard and, when needed, goes into Vercel as Sensitive.
# Access scopes start empty; each feature adds only the scopes it needs.

client_id = "25a2aa35a50545b4b2146c5162def482"
name = "Double Helix"
application_url = "https://example.com"
embedded = true

[webhooks]
api_version = "2026-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products and read_inventory: the Events subscriptions below (SHO-171).
scopes = "read_products,read_inventory"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]

# Shopify Events (SHO-171): when something a web page shows changes, Shopify
# calls the web store, which clears that page's cache (apps/web/app/api/
# shopify-events). Production only: one app has one delivery address, and
# previews keep the hourly backstop.
#
# ⚠️ Before deploying: replace the uri's host with the production domain (Ben
# confirms it), and check the product trigger names. price and compareAtPrice
# are from Shopify's reference; title, handle and status follow the same
# pattern. A wrong one fails `shopify app deploy`, so nothing ships broken.
[events]
api_version = "2026-10"

  [[events.subscription]]
  handle = "product-changed"
  topic = "Product"
  actions = ["update"]
  triggers = [
    "product.title",
    "product.handle",
    "product.status",
    "product.variants.price",
    "product.variants.compareAtPrice",
  ]
  uri = "https://PRODUCTION-DOMAIN/api/shopify-events"
  query = """
  query product_changed($productId: ID!) {
    product(id: $productId) { handle collections(first: 20) { nodes { handle } } }
  }
  """

  # Stock: changes to an item's levels arrive on the item itself, so no
  # narrower trigger is needed. Sold-out states read this.
  [[events.subscription]]
  handle = "stock-changed"
  topic = "InventoryItem"
  actions = ["update"]
  uri = "https://PRODUCTION-DOMAIN/api/shopify-events"
  query = """
  query stock_changed($inventoryItemId: ID!) {
    inventoryItem(id: $inventoryItemId) {
      variant { product { handle collections(first: 20) { nodes { handle } } } }
    }
  }
  """

  [[events.subscription]]
  handle = "collection-changed"
  topic = "Collection"
  actions = ["update"]
  triggers = ["collection.title", "collection.handle", "collection.descriptionHtml"]
  uri = "https://PRODUCTION-DOMAIN/api/shopify-events"
  query = """
  query collection_changed($collectionId: ID!) {
    collection(id: $collectionId) { handle }
  }
  """

  # Created or deleted products and collections refresh the home page's
  # cards and the sitemap. A delete has no data to query.
  [[events.subscription]]
  handle = "catalogue-added-or-removed"
  topic = "Product"
  actions = ["create", "delete"]
  uri = "https://PRODUCTION-DOMAIN/api/shopify-events"

  [[events.subscription]]
  handle = "collections-added-or-removed"
  topic = "Collection"
  actions = ["create", "delete"]
  uri = "https://PRODUCTION-DOMAIN/api/shopify-events"
